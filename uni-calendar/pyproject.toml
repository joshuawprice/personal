[project]
name = "uni-calendar"
version = "0.1.0"
description = "A partially vibecoded calendar app for displaying my university calendar."
readme = "README.md"
authors = [
    { name = "Joshua Price", email = "git@jprice.uk" }
]
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "requests"]

[project.scripts]
uni-calendar = "uni_calendar:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
