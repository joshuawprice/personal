[project]
name = "kobeni"
version = "0.0.1"
description = "Basic discord bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.6.0",
    "protobuf>=6.31.1",
    "pynacl>=1.5.0",
]

[build-system]
requires = [
    "hatchling",
    "protobuf",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = [
  "*.proto",
]

[tool.hatch.build.targets.wheel.hooks.custom]
