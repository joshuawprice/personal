[project]
name = "kobeni"
version = "0.0.1"
description = "Basic discord bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "davey~=0.1.5",
    "discord-py~=2.6",
    "protobuf~=7.34",
    "pynacl~=1.6",
    "python-dotenv~=1.2",
    # Ice guarantees source code compatibility for most recent version, and
    # 3.8 is already newer than the MumbleServer.ice as of time of writing.
    "zeroc-ice==3.8.1",
]

[project.scripts]
kobeni = "kobeni.cli:main"

[build-system]
requires = [
    "hatchling~=1.27",
    "protobuf~=7.34",
    # The version specified here is not bound by the uv.lock file, so the
    # version here must match the version in dependencies above exactly.
    "zeroc-ice==3.8.1",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = [
  "*.proto",
]

[tool.hatch.build.targets.wheel.hooks.custom]
